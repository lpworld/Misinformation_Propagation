# Phase 5 — robustness sensitivity sweeps.
# Runs four sensitivity axes in sequence on the corrected slow/fast
# partition + zero-inflated NB calibration from Phase 3-4. For each
# variant, runs the Phase 4 pipeline and records the bootstrap-CI
# contrasts on cascade_size and audience_reach.

random_seed: 1337

data:
  parts:
    - data/processed/part_1.parquet
    - data/processed/part_2.parquet
  primary_part: data/processed/part_1.parquet  # used for non-data-axis sweeps

labels:
  iffy_path: data/labels/iffy_plus.csv
  mainstream_path: data/labels/mainstream_domains.txt

ranker:
  load_dir: data/processed/phase3_full/ranker  # baseline trained ranker

simulation:
  n_users: 50000
  n_per_label: 2500
  n_replicates: 100
  n_time_bins: 24
  decay_tau_hours: 6.0
  exposure_min: 0.0
  exposure_max: 50000.0
  score_normalization: median
  use_circadian: true
  bootstrap_iterations: 1000

calibration:
  enabled: true
  target: zero_inflated_nb

sweeps:
  # Sweep 1: Alternative ablation forms (adds ratio_correction, reflective_floor
  # to the standard 3-regime set). All compared against additive baseline.
  ablation_forms:
    - additive
    - ablated
    - additive_retuned
    - ratio_correction
    - reflective_floor

  # Sweep 2: Slow/fast partition variants. The architectural mechanism
  # claim should be robust to where the borderline heads (deep, like) get
  # placed within reasonable defensible partitions.
  partitions:
    - name: default (reply,deep | retweet,like)
      slow: [reply, deep]
      fast: [retweet, like]
    - name: quote-as-fast (reply | retweet,like,deep)
      slow: [reply]
      fast: [retweet, like, deep]
    - name: like-as-slow (reply,deep,like | retweet)
      slow: [reply, deep, like]
      fast: [retweet]
    - name: reply-only-slow (reply | retweet,like)
      slow: [reply]
      fast: [retweet, like]

  # Sweep 3: Ranker training seeds. Tests stability of the architectural
  # finding to MaskNet's training stochasticity.
  ranker_seeds: [1337, 42, 7, 100, 2024]

  # Sweep 4: Data parts. Tests cross-temporal generalization (part_1 is
  # June 12-14 2024; part_2 is June 14-21 2024).

artifacts:
  out_dir: data/processed/phase5
  report_path: paper/phase5_report.md
  ranker_seeds_subdir: ranker_seeds
