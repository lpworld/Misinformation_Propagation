# Phase 4 — Stage 2 hypothesis test (label-aware).
#
# Runs the simulator under all three pre-specified scoring regimes with
# label-stratified seeds, computes the cascade-size / audience-reach /
# time-to-peak gaps between low- and high-credibility content, and the
# cross-regime contrasts.
#
# Calibration parameters are inherited from the Phase 3 zero-inflated
# Negative-Binomial calibration (additive regime), per the
# pre-registration in paper/phase4_preregistration.md.

random_seed: 1337

data:
  part_parquet: data/processed/part_1.parquet

labels:
  iffy_path: data/labels/iffy_plus.csv
  mainstream_path: data/labels/mainstream_domains.txt

ranker:
  load_dir: data/processed/phase3_full/ranker

simulation:
  n_users: 50000
  n_per_label: 2500          # → 5000 cascades per replicate (2500 low + 2500 high)
  n_replicates: 100          # 3 regimes × 100 replicates = 300 simulator runs
  bootstrap_iterations: 1000 # cascade-level bootstrap (methodology amendment 2026-04-26)
  n_time_bins: 24
  decay_tau_hours: 6.0
  exposure_min: 0.0
  exposure_max: 50000.0
  score_normalization: median
  use_circadian: true

calibration:
  enabled: true
  target: zero_inflated_nb

scoring:
  alpha: 1.0

artifacts:
  out_dir: data/processed/phase4
  report_path: paper/phase4_report.md
  preregistration_path: paper/phase4_preregistration.md
