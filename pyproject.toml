[project]
name = "misinformation-mechanism-repro"
version = "1.0.0"
description = "Reproducibility package: component-level study of engagement fungibility in an engagement-based recommender."
requires-python = ">=3.10,<3.13"
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "pyarrow>=15",
    "pyyaml>=6",
    "tldextract>=5.1",
    "requests>=2.31",
    "tqdm>=4.66",
    "scipy>=1.12",
    "networkx>=3.2",
    "matplotlib>=3.8",
    "torch>=2.2,<3",
    "scikit-learn>=1.4,<2",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
